<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Placement Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        form p input:not([type="checkbox"]), form p select, form p textarea {
            width: 100%;
            padding: .375rem .75rem;
            border: 1px solid #ced4da;
            border-radius: .375rem;
        }
        form p label { display: block; font-weight: 500; margin-bottom: .25rem; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'application_list' %}">Placement Tracker</a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <a class="text-white text-decoration-none" href="{% url 'application_list' %}">Applications</a>
                <a class="text-white text-decoration-none" href="{% url 'dashboard' %}">Dashboard</a>
                <span class="text-white-50">Hello, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
